<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css" />
    {% block head %}{% endblock %}
  </head>
  <body>
    <header class="site-header">
      <div class="shell site-header__inner">
        <span class="brand">MLB Stats Visualizer</span>
        <span class="brand__section">Team Hitting</span>
      </div>
    </header>

    <main class="shell page">{% block content %}{% endblock %}</main>

    <footer class="site-footer">
      <div class="shell">
        {% block footer %}
          <p>Source: MLB Stats API via python-mlb-statsapi.</p>
        {% endblock %}
        <p class="site-footer__disclaimer">
          Educational project. Not affiliated with Major League Baseball.
        </p>
      </div>
    </footer>
  </body>
</html>

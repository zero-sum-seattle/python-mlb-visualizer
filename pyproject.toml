[tool.poetry]
name = "mlb-stats-visualizer"
version = "0.1.0"
description = "Interactive MLB statistics visualization web application"
authors = ["Matthew Spah <spahmatthew@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.34.0" }
jinja2 = "^3.1.0"
pydantic-settings = "^2.7.0"
# The async MLB client (``AsyncMlb``) ships on the client library's
# release/1.1.0 branch and is not on PyPI yet, so the dependency points at
# the branch. The ``async`` extra pulls in httpx, which AsyncMlb needs.
python-mlb-statsapi = { git = "https://github.com/zero-sum-seattle/python-mlb-statsapi.git", branch = "release/1.1.0", extras = ["async"] }
# Local alternative, for changing the client and this repository together.
# Swap the two lines and re-run `poetry lock`.
# python-mlb-statsapi = { path = "../python-mlb-statsapi", develop = true, extras = ["async"] }
sqlalchemy = "^2.0.0"
alembic = "^1.14.0"
plotly = "^6.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.0"
ruff = "^0.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=app", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
